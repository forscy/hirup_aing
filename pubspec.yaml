name: hirup_aing
description: "Aplikasi Simeta Mobile Apps"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.1
  http: ^1.3.0
  intl: ^0.20.2
  jwt_decoder: ^2.0.1
  percent_indicator: ^4.2.3
  provider: ^6.1.4
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  path: ^1.9.1
  # qr_code_scanner: ^1.0.1
  mobile_scanner: ^6.0.10
  equatable: ^2.0.7
  uuid: ^4.5.1
  file_picker: ^10.1.2
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/

  fonts:
    - family: Dongle
      fonts:
        - asset: assets/fonts/Dongle/Dongle-Light.ttf
          # weight: 300
        - asset: assets/fonts/Dongle/Dongle-Regular.ttf
          # weight: 400
        - asset: assets/fonts/Dongle/Dongle-Bold.ttf
          # weight: 700
    - family: SKCuriosity
      fonts:
        - asset: assets/fonts/SKCuriosity/SKCuriosity-Regular.ttf
          # weight: 400
        - asset: assets/fonts/SKCuriosity/SKCuriosity-Bold.ttf
          # weight: 700
        - asset: assets/fonts/SKCuriosity/SKCuriosity-Light.ttf